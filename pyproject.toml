[project]
name = "manipulation-game"
version = "0.1.0"
description = "OpenRouter OpenAI-compatible sample"
requires-python = ">=3.9"
dependencies = [
  "jinja2>=3.1.6",
  "matplotlib>=3.9.4",
  "openai>=1.40.0",
  "pydantic>=2.12.5",
  "pyqt5>=5.15.11",
  "python-dotenv>=1.0.1",
  "sympy>=1.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
]

[tool.pytest.ini_options]
markers = [
  "integration: hits the OpenRouter API (network required)",
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
